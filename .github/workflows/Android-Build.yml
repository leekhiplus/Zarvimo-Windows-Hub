name: Android Build

# Builds a debug APK from a project ZIP that lives in this repository.
# Upload the project ZIP (for example ZarvimoWindowsHub.zip) to the repo as-is; no manual extraction is needed.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate and extract the project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/.zip-build"
          rm -rf "$dest"
          mkdir -p "$dest"

          # 1. Find a ZIP (up to 4 folders deep) that contains a Gradle settings file.
          found=""
          count=0
          while IFS= read -r -d '' z; do
            listing="$(unzip -Z1 "$z" 2>/dev/null || true)"
            if grep -Eq '(^|/)settings\.gradle(\.kts)?$' <<< "$listing"; then
              count=$((count + 1))
              echo "Candidate project ZIP: $z"
              if [ -z "$found" ]; then found="$z"; fi
            fi
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -iname '*.zip' \
                     -not -path '*/.git/*' -not -path "$dest/*" -print0 | sort -z)

          if [ -n "$found" ]; then
            if [ "$count" -gt 1 ]; then
              echo "::warning::$count project ZIPs found; using the first one alphabetically: $found"
            fi
            echo "Extracting $found into $dest"
            unzip -q "$found" -d "$dest"
            search_root="$dest"
          elif [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ] || [ -f "$GITHUB_WORKSPACE/settings.gradle" ]; then
            echo "No project ZIP found, but the repository itself is a Gradle project. Building it directly."
            search_root="$GITHUB_WORKSPACE"
          else
            echo "::error::No ZIP archive containing a Gradle project (settings.gradle[.kts]) was found in the repository. Upload the project ZIP to the repo."
            exit 1
          fi

          # 2. Locate the project root: the shallowest settings.gradle[.kts].
          settings="$(find "$search_root" -maxdepth 3 -type f \( -name settings.gradle.kts -o -name settings.gradle \) \
                       -not -path '*/__MACOSX/*' -not -path '*/.zip-build/*/.zip-build/*' \
                       | awk '{ print length($0) " " $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$settings" ]; then
            echo "::error::Extracted archive has no settings.gradle[.kts]."
            exit 1
          fi
          project_dir="$(dirname "$settings")"

          if [ ! -f "$project_dir/gradlew" ] || [ ! -f "$project_dir/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::Gradle wrapper (gradlew and gradle/wrapper/gradle-wrapper.jar) is missing from $project_dir."
            exit 1
          fi
          chmod +x "$project_dir/gradlew"

          echo "Project directory: $project_dir"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and ensure platform 35
        shell: bash
        run: |
          set -uo pipefail
          sdkmanager="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$sdkmanager" ]; then
            yes | "$sdkmanager" --licenses > /dev/null || true
            "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || echo "::warning::sdkmanager install step failed; Gradle will try to download missing components."
          else
            echo "::warning::sdkmanager not found; relying on Gradle to download SDK components."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Show APK details
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          apk="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          ls -l "$apk"
          {
            echo "### Debug APK built"
            echo ""
            echo "- File: \`$(basename "$apk")\`"
            echo "- Size: $(du -h "$apk" | cut -f1)"
            echo "- SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zarvimo-Windows-Hub-debug-apk
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Runs after the APK is already uploaded: a failing test is reported but does not discard the APK.
      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Upload unit test report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: ${{ steps.extract.outputs.project_dir }}/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
